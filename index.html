<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DZK · Home</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --ink: #1f2328;
      --muted: #6b7280;
      --accent: #e65c41;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    main {
      max-width: 720px;
      width: 100%;
      background: var(--card);
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 3rem 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #f0a500);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.9rem; margin-bottom: 0.4rem; }
    .tagline { color: var(--muted); font-size: 1.05rem; margin-bottom: 1.5rem; }
    p { line-height: 1.75; color: #374151; }
    .links { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .links a {
      text-decoration: none;
      color: var(--ink);
      border: 1px solid #d1d5db;
      border-radius: 999px;
      padding: 0.5rem 1.1rem;
      font-size: 0.95rem;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .links a:hover { border-color: var(--accent); color: var(--accent); background: #fff7f5; }
    footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <div class="avatar">D</div>
    <h1>Hi, I'm DZK</h1>
    <p class="tagline">你好，欢迎来到我的主页 👋</p>
    <p>
      我是一名开发者，喜欢折腾代码、工具和一切有趣的东西。
      这个主页很简单，以后会慢慢充实起来。
    </p>
    <div class="links">
      <a href="https://github.com/ddzzkk" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:hello@example.com">Email</a>
    </div>
    <footer>© 2026 ddzzkk · Made with ♥</footer>
  </main>
</body>
</html>
