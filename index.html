<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DZK · Home</title>
  <style>
    :root {
      --ink: #e8ecf4;
      --muted: #9aa4b8;
      --accent-1: #7c5cff;
      --accent-2: #00d4ff;
      --accent-3: #ff5c8a;
      --card-border: rgba(255, 255, 255, 0.12);
      --card-bg: rgba(255, 255, 255, 0.055);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: #0b0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    /* background: subtle grid */
    .grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%);
      mask-image: radial-gradient(ellipse at center, #000 25%, transparent 75%);
    }

    /* background: drifting aurora blobs */
    .blob {
      position: fixed;
      z-index: 0;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      animation: drift 20s ease-in-out infinite;
    }
    .blob-1 { width: 440px; height: 440px; background: var(--accent-1); top: -140px; left: -100px; }
    .blob-2 { width: 400px; height: 400px; background: var(--accent-2); bottom: -120px; right: -80px; animation-delay: -7s; }
    .blob-3 { width: 320px; height: 320px; background: var(--accent-3); top: 42%; left: 58%; opacity: 0.32; animation-delay: -13s; }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(48px, -36px) scale(1.08); }
      66%      { transform: translate(-36px, 30px) scale(0.94); }
    }

    /* main glass card */
    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3.5rem 2.5rem 2.5rem;
      text-align: center;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: fade-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(26px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* avatar with spinning conic ring */
    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    .avatar {
      position: relative;
      width: 104px;
      height: 104px;
      margin: 0 auto 1.8rem;
    }
    .avatar .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from var(--angle),
        var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
      animation: spin 5s linear infinite;
    }
    @keyframes spin { to { --angle: 360deg; } }

    .avatar .face {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #12182b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.7rem;
      font-weight: 800;
      background-image: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* shimmering gradient name */
    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      background: linear-gradient(90deg,
        var(--accent-1), var(--accent-2), var(--accent-3), var(--accent-1));
      background-size: 240% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 7s linear infinite;
    }
    @keyframes shimmer { to { background-position: 240% 0; } }

    .tagline {
      margin-top: 0.8rem;
      font-size: 1.12rem;
      color: var(--muted);
      min-height: 1.8em;
    }
    .tagline .cursor {
      display: inline-block;
      width: 2px;
      margin-left: 2px;
      background: var(--accent-2);
      animation: blink 0.9s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }

    .intro {
      margin-top: 1.4rem;
      line-height: 1.85;
      color: #c3cad9;
      font-size: 0.98rem;
    }

    /* skill chips */
    .chips {
      margin-top: 1.8rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.55rem;
    }
    .chips span {
      font-size: 0.82rem;
      padding: 0.32rem 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }
    .chips span:hover {
      border-color: var(--accent-2);
      color: var(--ink);
      transform: translateY(-2px);
    }

    /* links */
    .links {
      margin-top: 2.2rem;
      display: flex;
      justify-content: center;
      gap: 0.9rem;
    }
    .links a {
      text-decoration: none;
      color: var(--ink);
      font-size: 0.95rem;
      padding: 0.62rem 1.4rem;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .links a:hover {
      transform: translateY(-3px);
      border-color: var(--accent-2);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.18);
    }
    .links a.primary {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      border-color: transparent;
      color: #fff;
    }
    .links a.primary:hover {
      box-shadow: 0 8px 28px rgba(124, 92, 255, 0.4);
    }

    /* status line */
    .status {
      margin-top: 2.1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
      100% { box-shadow: 0 0 0 9px rgba(52, 211, 153, 0); }
    }

    footer {
      margin-top: 2.4rem;
      font-size: 0.82rem;
      color: #67718a;
    }

    @media (max-width: 520px) {
      main { padding: 2.6rem 1.4rem 2rem; }
      h1 { font-size: 2rem; }
      .links { flex-direction: column; align-items: center; }
      .links a { width: 100%; max-width: 260px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <main>
    <div class="avatar">
      <div class="ring"></div>
      <div class="face">D</div>
    </div>

    <h1>DZK</h1>
    <p class="tagline">
      我是 <span id="type"></span><span class="cursor"></span>
    </p>

    <p class="intro">
      开发者，喜欢折腾代码、工具和一切有趣的东西。
      这里是我的小站，简单但会越来越酷。
    </p>

    <div class="chips">
      <span>C / C++</span>
      <span>Python</span>
      <span>CMake</span>
      <span>LLVM</span>
      <span>Git</span>
      <span>Linux</span>
    </div>

    <div class="links">
      <a class="primary" href="https://github.com/ddzzkk" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:hello@example.com">Email</a>
    </div>

    <span class="status"><span class="dot"></span>Open to cool projects</span>
  </main>

  <footer>© 2026 ddzzkk · Made with ♥</footer>

  <script>
    const phrases = ["开发者", "代码折腾者", "终身学习者", "工具控"];
    const el = document.getElementById("type");
    let p = 0, c = 0, deleting = false;

    function tick() {
      const word = phrases[p];
      el.textContent = word.slice(0, c);
      if (!deleting) {
        if (c < word.length) { c++; setTimeout(tick, 90); }
        else { deleting = true; setTimeout(tick, 1700); }
      } else {
        if (c > 0) { c--; setTimeout(tick, 45); }
        else { deleting = false; p = (p + 1) % phrases.length; setTimeout(tick, 350); }
      }
    }
    tick();
  </script>
</body>
</html>
